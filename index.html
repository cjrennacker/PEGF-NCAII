<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fernwood photo study</title>
<style>
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#18202A; --muted:#566370; --line:#D8DEE4; --tint:#E5EAEF;
  --brand:#1F6F5B; --brand-ink:#FFFFFF; --brand-soft:#DCEEE7; --danger:#B3261E; --warn:#8A5A00; --warn-soft:#FFF1CF;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --surface:#1A2129; --ink:#E9EEF2; --muted:#A2AEBA; --line:#2C3641; --tint:#222B34;
  --brand:#52BE9F; --brand-ink:#0A1D17; --brand-soft:#1B3A31; --danger:#FF8A80; --warn:#F2C260; --warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --surface:#1A2129; --ink:#E9EEF2; --muted:#A2AEBA; --line:#2C3641; --tint:#222B34;
  --brand:#52BE9F; --brand-ink:#0A1D17; --brand-soft:#1B3A31; --danger:#FF8A80; --warn:#F2C260; --warn-soft:#3A2F12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:700} h2{font-size:21px;font-weight:700} h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
/* study pages */
.study{max-width:680px;margin-inline:auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:18px}
.study .top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px}
.preview{background:var(--warn-soft);color:var(--ink);border:1px solid var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:6px;padding:10px 18px;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.link{background:none;border:0;color:var(--brand);padding:0;text-decoration:underline;font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--brand);flex:none}
.opt.on{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.field{display:flex;flex-direction:column;gap:6px}
.field input[type=text],.field textarea{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--surface)}
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:8px 0;background:var(--surface);cursor:pointer}
.scale input{accent-color:var(--brand)}
.scale label:has(input:checked){border-color:var(--brand);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cam{width:100%;max-width:360px;aspect-ratio:1;border-radius:8px;background:var(--tint);overflow:hidden;position:relative;border:1px solid var(--line)}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam img{transform:none}
.cam .guide{position:absolute;inset:14% 26%;border:2px dashed rgba(255,255,255,.85);border-radius:50%;pointer-events:none}
.avatar{border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
/* platform */
.fw{min-height:100vh}
.fw-head{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.fw-in{max-width:1100px;margin-inline:auto;padding:8px 16px;display:flex;align-items:center;gap:14px}
.fw-logo{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-size:22px;font-weight:700;color:var(--brand);cursor:pointer;background:none;border:0;padding:0}
.fw-search{flex:1;max-width:340px}
.fw-search input{width:100%;border:1px solid var(--line);background:var(--tint);border-radius:20px;padding:7px 14px}
.fw-nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.fw-nav button{background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:600;position:relative}
.fw-nav button:hover{background:var(--tint)}
.fw-nav .on{color:var(--brand)}
.badge{position:absolute;top:2px;right:2px;background:var(--danger);color:#fff;border-radius:10px;font-size:10px;padding:0 5px;line-height:16px}
.exit{font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;padding:4px 6px}
.fw-grid{max-width:1100px;margin-inline:auto;padding:16px;display:grid;grid-template-columns:200px minmax(0,1fr) 250px;gap:16px;align-items:start}
.fw-side{display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.fw-side div{padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:600}
.fw-side div.on{background:var(--surface);color:var(--ink)}
.fw-feed{display:flex;flex-direction:column;gap:14px;max-width:600px;width:100%;margin-inline:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);position:relative}
.post-h{display:flex;gap:10px;align-items:center;padding:12px 14px}
.post-h .who{flex:1;min-width:0;line-height:1.25}
.post-h .who b{display:block}
.post-t{padding:0 14px 12px;overflow-wrap:anywhere}
.post-m{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--tint)}
.post-m svg{display:block;width:100%;height:100%}
.post-a{display:flex;gap:4px;padding:6px 8px;border-top:1px solid var(--line)}
.post-a button{flex:1;background:none;border:0;padding:8px;border-radius:6px;color:var(--muted);font-weight:600}
.post-a button:hover{background:var(--tint)}
.dots{background:none;border:0;font-size:20px;line-height:1;padding:4px 10px;border-radius:6px;color:var(--muted)}
.dots:hover{background:var(--tint)}
.menu{position:absolute;right:10px;top:46px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:210px;padding:4px;z-index:3}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px}
.menu button:hover{background:var(--tint)}
.gone{padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.fw-rail{position:sticky;top:64px;display:flex;flex-direction:column;gap:10px}
.fw-rail .card{padding:14px;display:flex;flex-direction:column;gap:10px}
.contact{display:flex;gap:10px;align-items:center}
.dotg{width:9px;height:9px;border-radius:50%;background:#3FAE6A;margin-left:auto}
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay.top{z-index:30}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:520px;max-height:92vh;overflow:auto;display:flex;flex-direction:column}
.modal.wide{max-width:720px}
.m-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface)}
.m-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.m-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.x{background:none;border:0;font-size:22px;line-height:1;padding:2px 8px;color:var(--muted)}
.rrow{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow input{margin-top:3px;width:18px;height:18px;accent-color:var(--brand);flex:none}
.rrow b{display:block;font-weight:600}
.doc{display:flex;flex-direction:column;gap:14px}
.doc h3{margin-top:6px}
.doc p{max-width:64ch}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;font-size:14px}
/* protect */
.meter{height:12px;border-radius:6px;background:var(--tint);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand);transition:width .25s}
.meter.bad i{background:var(--danger)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tog{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.tog:first-of-type{border-top:0}
.tog input{width:18px;height:18px;margin-top:3px;accent-color:var(--brand);flex:none}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.log{font:12px/1.4 Consolas,Menlo,monospace;width:100%;min-height:160px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--surface)}
@media(max-width:900px){.fw-grid{grid-template-columns:minmax(0,1fr)}.fw-side,.fw-rail{display:none}.fw-search{display:none}}
@media(max-width:560px){.overlay{padding:0;align-items:stretch}.modal{max-width:none;max-height:none;border-radius:0}.fw-nav button{padding:8px 6px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';
/* ================= CONFIG (edit these) ================= */
const CONFIG={
  ENDPOINT:'',                       // Google Apps Script web app URL. Blank means preview mode: nothing is sent.
  TOKEN:'change-me',                 // Must match TOKEN in Code.gs. Filters stray traffic. Not a secret.
  STUDY_VERSION:'0.1-prototype',
  ARMS:['status_quo','direct'],
  DIRECT_FIRST:true,                 // In the direct arm, the AI option is listed first. Everything else is shuffled in both arms.
  SUBJECT_MODE:'choice',             // 'choice' lets the participant pick self or stand-in. 'standin' forces the stand-in.
  STANDIN_NAME:'Jordan Ellis',
  COMPLETION_URL:'',                 // Prolific completion URL
  COMPLETION_CODE:'REPLACE-ME',
  GIVE_UP_AFTER_MS:150000,           // The "I'd stop here" button always exists. This only brightens it.
  LAST_REVIEWED:'[add date]'
};
const PREVIEW=!CONFIG.ENDPOINT;

/* ================= pathways and policy text (placeholders to pretest) ================= */
const PATHS={
  ip:{label:'Copyright or intellectual property',hint:'Someone is using creative work without permission'},
  imp:{label:'Impersonation or fake account',hint:'Someone is pretending to be a person, group or brand'},
  priv:{label:'Privacy violation',hint:'Personal information or images shared without permission'},
  har:{label:'Harassment or bullying',hint:'Abuse, threats or repeated unwanted contact'},
  nud:{label:'Nudity or sexual content',hint:'Content that shows nudity or sexual activity'},
  scam:{label:'Spam, scam or misleading content',hint:'Content meant to deceive people'},
  ai:{label:'AI-generated or manipulated image of a real person',hint:'An image made or changed with AI that shows a real person'},
  other:{label:'Something else',hint:'None of the options above fit'}
};
const ARM_PATHS={status_quo:['ip','imp','priv','har','nud','scam','other'],direct:['ai','ip','imp','priv','har','nud','scam','other']};
const FORMS={
  ip:[{t:'radio',n:'owner',l:'Who owns the work?',o:['I do','Someone I represent','I am not sure']},{t:'text',n:'desc',l:'Describe the work and where it appears (optional)'},{t:'check',n:'ack',l:'I believe in good faith that this use is not authorized.',req:1}],
  imp:[{t:'radio',n:'who',l:'Who is being impersonated?',o:['Me','Someone I know','A public figure or brand']},{t:'text',n:'desc',l:'Tell us more (optional)'}],
  priv:[{t:'radio',n:'what',l:'What was shared?',o:['Personal information','An image of me or someone I know','Something else']},{t:'text',n:'desc',l:'Tell us more (optional)'}],
  har:[{t:'radio',n:'who',l:'Who is being targeted?',o:['Me','Someone I know','A group']},{t:'text',n:'desc',l:'Tell us more (optional)'}],
  nud:[{t:'radio',n:'kind',l:'What does the content show?',o:['Nudity','Sexual activity','Not sure']},{t:'text',n:'desc',l:'Tell us more (optional)'}],
  scam:[{t:'radio',n:'kind',l:'What is misleading about it?',o:['A scam or fraud','False claims','Fake engagement']},{t:'text',n:'desc',l:'Tell us more (optional)'}],
  ai:[{t:'radio',n:'whose',l:'Whose likeness appears in the image?',o:['Me','Someone I know','A public figure']},{t:'radio',n:'consent',l:'Did they agree to this image?',o:['No','I do not know']},{t:'text',n:'desc',l:'Tell us more (optional)'}],
  other:[{t:'text',n:'desc',l:'Tell us what is wrong',req:1}]
};
const POLICY={
  intro:['These guidelines describe what is and is not allowed on Fernwood, and how to report content that may break them.','You can report posts, comments, accounts and messages from the menu on each item. Choose the option that best describes the problem. If more than one applies, choose the one that matters most to you.'],
  sections:{
    ip:['Copyright and intellectual property','Copyright covers original works such as photos, videos and writing. A report asks you to confirm that you own the work or act for the owner, and to describe the work.'],
    imp:['Impersonation and fake accounts','Accounts or content that pretend to be another person, group or brand in a way that could mislead others.'],
    priv:['Privacy','Content that shares private information or private images of a person without their permission.'],
    har:['Harassment and bullying','Content that targets a person with abuse, threats or repeated unwanted contact.'],
    nud:['Nudity and sexual content','Content that shows nudity or sexual activity.'],
    scam:['Spam, scams and misleading content','Content meant to deceive people for money, to inflate engagement or to spread false claims.'],
    ai:['AI-generated or manipulated images of real people','Images created or changed with AI tools that show a real person in a way that did not happen. A report asks whose likeness appears and whether they agreed to the image.'],
    other:['Something else','If your concern does not match an option, tell us what is wrong in your own words.']
  },
  after:['What happens after you report','Our team reviews reports. We may remove content, limit an account or take no action. We will tell you that we received your report.']
};

/* ================= data: feed and subjects ================= */
const FEED=[
  {id:'p1',name:'Priya Natarajan',handle:'priya.n',hue:18,time:'2h',text:'Sunday reset. Farmers market haul and a very serious cup of coffee.',seed:3,likes:24,comments:3},
  {id:'p2',name:'Dev Okafor',handle:'devokafor',hue:205,time:'3h',text:'The trail was muddier than the forecast promised. Worth it.',seed:7,likes:61,comments:9},
  {id:'TARGET',name:'Marlo Deals',handle:'marlo.deals',hue:40,time:'1h',text:'',seed:0,likes:318,comments:42,target:true},
  {id:'p4',name:'Camille Aubert',handle:'camille.a',hue:330,time:'6h',text:'Finished the mural. Thank you to everyone who held a ladder.',seed:11,likes:102,comments:14},
  {id:'p5',name:'Tomas Reyes',handle:'tomasr',hue:140,time:'8h',text:'Lake was glass this morning. Nobody else was out yet.',seed:5,likes:47,comments:2},
  {id:'p6',name:'Wren Calloway',handle:'wren.c',hue:265,time:'9h',text:'New desk setup. Cable management is a lifestyle.',seed:9,likes:33,comments:6}
];
const CONTACTS=[['Priya Natarajan',18],['Dev Okafor',205],['Camille Aubert',330],['Tomas Reyes',140]];

/* ================= utils ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uuid(){const a=new Uint8Array(8);crypto.getRandomValues(a);return Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rnd){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let hiddenTotal=0,hiddenAt=null;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=performance.now();log('page','hidden')}else if(hiddenAt!=null){hiddenTotal+=performance.now()-hiddenAt;hiddenAt=null;log('page','visible')}});
const clock=()=>Math.round(performance.now()-hiddenTotal);
const qs=new URLSearchParams(location.search);

/* ================= state ================= */
const P={
  pid:qs.get('PROLIFIC_PID')||('p_'+uuid()),session:qs.get('SESSION_ID')||('s_'+uuid()),studyId:qs.get('STUDY_ID')||'',
  screen:'consent',arm:null,assignSource:'',subject:'',name:'',srcCanvas:null,targetUrl:'',cam:'off',altConsent:false,
  startedAt:new Date().toISOString(),completedAt:'',status:'in_progress',seq:0,events:[],queue:[],
  t:{},view:'home',menuFor:null,gone:{},toast:'',rep:null,pol:null,polDwell:0,polOpens:0,
  counts:{menu:0,reportOpens:0,hide:0,block:0,save:0,copy:0,like:0,comment:0,search:0,nontarget:0},
  firstPath:'',finalPath:'',pathChanges:0,backs:0,order:[],gaveUp:0,formJson:'',survey:{},prot:{},exitOpen:false
};
let STREAM=null;

/* ================= logging and network ================= */
let flushTimer=null;
function log(verb,object,result){
  const e={pid:P.pid,session:P.session,seq:++P.seq,t_ms:clock(),ts:new Date().toISOString(),screen:P.screen,verb:verb,object:object||'',result:result==null?'':JSON.stringify(result)};
  P.events.push(e);P.queue.push(e);
  if(P.queue.length>=12)flush();else{clearTimeout(flushTimer);flushTimer=setTimeout(flush,1500)}
}
function post(payload){
  if(PREVIEW)return Promise.resolve();
  payload.token=CONFIG.TOKEN;
  return fetch(CONFIG.ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),keepalive:true});
}
function flush(){
  if(!P.queue.length)return;
  const rows=P.queue.splice(0,P.queue.length);
  if(PREVIEW)return;
  post({type:'events',rows:rows}).catch(()=>{P.queue=rows.concat(P.queue)});
}
function dur(a,b){return(P.t[a]!=null&&P.t[b]!=null)?P.t[b]-P.t[a]:''}
function summary(){
  const s=P.survey;
  return {pid:P.pid,session_id:P.session,study_id:P.studyId,study_version:CONFIG.STUDY_VERSION,arm:P.arm,assign_source:P.assignSource,subject:P.subject,
    name_given:P.name?1:0,started_at:P.startedAt,completed_at:P.completedAt,status:P.status,
    device:(/Mobi|Android|iPhone/i.test(navigator.userAgent)?'mobile':'desktop'),viewport:innerWidth+'x'+innerHeight,
    menu_first_ms:dur('task_start','menu_open'),discovery_ms:dur('task_start','post_seen'),to_report_ms:dur('post_seen','report_open'),
    decision_ms:dur('report_open','first_select'),select_to_next_ms:dur('first_select','next'),report_total_ms:dur('report_open','submit'),
    task_total_ms:dur('task_start','submit'),policy_opens:P.polOpens,policy_dwell_ms:Math.round(P.polDwell),
    first_path:P.firstPath,final_path:P.finalPath,path_changes:P.pathChanges,back_count:P.backs,option_order:P.order.join('>'),
    report_opens:P.counts.reportOpens,hide_count:P.counts.hide,block_count:P.counts.block,nontarget_report:P.counts.nontarget,gave_up:P.gaveUp,
    form_json:P.formJson,q_clarity:s.clarity||'',q_confidence:s.confidence||'',q_ai_look:s.ailook||'',q_realism:s.realism||'',
    q_prior_report:s.prior||'',q_best_describes:s.desc||'',q_first_look_text:s.text||'',prot_json:JSON.stringify(P.prot),hidden_ms:Math.round(hiddenTotal)};
}
function sendSummary(){flush();return post({type:'summary',row:summary()})}
async function assignArm(){
  const forced=qs.get('arm');
  if(PREVIEW&&CONFIG.ARMS.includes(forced)){P.assignSource='url_preview';return forced}
  if(!PREVIEW){
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),4000);
      const r=await fetch(CONFIG.ENDPOINT+'?action=assign&token='+encodeURIComponent(CONFIG.TOKEN)+'&pid='+encodeURIComponent(P.pid),{cache:'no-store',signal:ctl.signal});
      clearTimeout(to);const j=await r.json();
      if(j&&CONFIG.ARMS.includes(j.arm)){P.assignSource='server';return j.arm}
    }catch(e){}
  }
  const a=new Uint32Array(1);crypto.getRandomValues(a);P.assignSource='client';return CONFIG.ARMS[a[0]%CONFIG.ARMS.length];
}

/* ================= images (all local) ================= */
function drawAvatar(ctx,w,h,o){
  ctx.fillStyle=o.bg;ctx.fillRect(0,0,w,h);
  ctx.fillStyle=o.shirt;ctx.beginPath();ctx.ellipse(w/2,h*1.02,w*.44,h*.32,0,Math.PI,2*Math.PI);ctx.fill();
  ctx.fillStyle=o.skin;ctx.fillRect(w*.43,h*.62,w*.14,h*.2);
  ctx.fillStyle=o.hair;ctx.beginPath();ctx.ellipse(w/2,h*.43,w*.27,h*.3,0,0,7);ctx.fill();
  ctx.fillStyle=o.skin;ctx.beginPath();ctx.ellipse(w/2,h*.47,w*.22,h*.27,0,0,7);ctx.fill();

 ['code','Agree a verification word with family for urgent requests',10,'ntc','Helps against cloned voices and fake messages.']
];
function protScores(){let e=75,n=15;PROT.forEach(p=>{if(P.prot[p[0]]){if(p[3]==='exp')e-=p[2];else n+=p[2]}});return[Math.max(0,e),Math.min(100,n)]}
function vProtect(){const s=protScores();
  return `<main class="study" style="max-width:860px">${previewNote()}${topbar('Protecting your image')}<div><p class="kicker">What you can do</p><h1 style="margin-top:6px">Protect your image and likeness</h1><p class="muted" style="margin-top:8px;max-width:60ch">Settings reduce exposure. They cannot stop someone else from misusing a photo, and misuse is never the fault of the person in the photo. Try the settings below and watch what changes.</p></div>
  <div class="two"><div class="sheet"><h3>Fernwood settings</h3>${PROT.map(p=>`<label class="tog"><input type="checkbox" data-act="prot" data-k="${p[0]}" ${P.prot[p[0]]?'checked':''}><span><b>${p[1]}</b><br><span class="muted small">${p[4]}</span></span></label>`).join('')}</div>
  <div class="sheet"><h3>What your choices do <span class="muted small">(illustrative)</span></h3><div class="field"><span>How easy it is to copy your photos: <b>${s[0]}</b> of 100</span><div class="meter bad"><i style="width:${s[0]}%"></i></div></div><div class="field"><span>How likely you are to notice misuse: <b>${s[1]}</b> of 100</span><div class="meter"><i style="width:${s[1]}%"></i></div></div>
  <p class="small muted">Some tools claim to cloak photos against AI. Evidence on how well they work is mixed, so treat them as one layer at most. Content credentials can show an image's edit history, but a missing credential does not prove an image is fake.</p></div></div>
  <div class="sheet"><h3>If it happens to you or someone you know</h3><ol class="steps"><li><b>Save evidence first.</b> Take screenshots that show the post, the account name, the link and the date.</li><li><b>Report on the platform.</b> Choose the most specific option you can find, and keep the confirmation.</li><li><b>Tell someone you trust.</b> You do not have to deal with it alone.</li><li><b>Look for copies.</b> Use a reverse image search and check where else the image appears.</li><li><b>Use specialist help.</b> For intimate images, StopNCII.org (adults) and Take It Down from the National Center for Missing and Exploited Children (under 18) can help stop spread. Campus services, legal aid and local law enforcement may also help.</li></ol><p class="small muted">Resources last reviewed: ${CONFIG.LAST_REVIEWED}. Check that each link and service is current before you rely on it.</p></div>
  <div class="row"><button class="btn" data-act="finish">Finish</button></div></main>`;
}
function csv(rows,cols){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return cols.join(',')+'\n'+rows.map(r=>cols.map(c=>q(r[c])).join(',')).join('\n')}
function vDone(){
  const logs=PREVIEW?`<div class="sheet"><h3>Preview data</h3><p class="muted small">In preview mode nothing is sent. This is what would be written to your Sheet.</p><b>Participants row</b><textarea class="log" readonly>${esc(JSON.stringify(summary(),null,1))}</textarea><b>Events</b><textarea class="log" readonly>${esc(csv(P.events,['seq','t_ms','ts','screen','verb','object','result']))}</textarea></div>`:'';
  return `<main class="study">${previewNote()}<div><p class="kicker">Done</p><h1 style="margin-top:6px">Thank you</h1></div><div class="sheet"><p>Your responses are recorded. Your photo was never uploaded or saved.</p>${CONFIG.COMPLETION_URL?`<div class="row"><a class="btn" style="text-decoration:none" href="${esc(CONFIG.COMPLETION_URL)}">Return to Prolific</a></div>`:`<p>Completion code: <b>${esc(CONFIG.COMPLETION_CODE)}</b></p>`}</div>${logs}</main>`;
}
function vExit(){return `<main class="study"><div><p class="kicker">Study ended</p><h1 style="margin-top:6px">You have left the study</h1></div><div class="sheet"><p>Thank you for your time. Your photo was never uploaded or saved. Placeholder: add the withdrawal code or instructions from your institutional review board here.</p><p class="muted">If anything in this study was upsetting, you can reach support through your campus counseling service or a local crisis line. Replace this line with approved resources.</p></div></main>`}
function exitModal(){return `<div class="overlay top"><div class="modal" role="dialog" aria-modal="true" aria-label="Exit study"><div class="m-h"><h3>Exit the study?</h3></div><div class="m-b"><p>You can stop at any time. Your photo will be cleared from this page.</p></div><div class="m-f"><button class="btn ghost" data-act="exit-no">Keep going</button><button class="btn" data-act="exit-yes">Exit study</button></div></div></div>`}

function render(){
  const v={consent:vConsent,setup:vSetup,brief:vBrief,platform:vPlatform,after:vAfter,debrief:vDebrief,protect:vProtect,done:vDone,exit:vExit}[P.screen];
  const y=window.scrollY;
  $('#root').innerHTML=v()+(P.exitOpen?exitModal():'');
  if(P.screen==='setup'&&P.cam==='live'&&STREAM){const el=$('#cam');if(el)el.srcObject=STREAM}
  if(P.screen==='platform')observeTarget();
  window.scrollTo(0,y);
}
let IO=null;
function observeTarget(){
  if(IO)IO.disconnect();if(P.t.post_seen!=null)return;
  const el=document.querySelector('[data-post="TARGET"]');if(!el||!('IntersectionObserver' in window))return;
  IO=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&P.t.post_seen==null){P.t.post_seen=clock();log('view','target_post');IO.disconnect()}})},{threshold:.5});IO.observe(el);
}
function setScreen(s){P.screen=s;log('screen',s);render();window.scrollTo(0,0)}
function toast(t){P.toast=t;render();setTimeout(()=>{P.toast='';render()},1800)}
function endPolicy(){if(P.pol){const d=clock()-P.pol.at;P.polDwell+=d;log('policy_close',P.pol.from,{dwell_ms:d});P.pol=null}}
function stopCam(){if(STREAM){STREAM.getTracks().forEach(t=>t.stop());STREAM=null}}
function clearImages(){stopCam();P.srcCanvas=null;P.targetUrl=''}
function openReport(){
  P.counts.reportOpens++;if(P.t.report_open==null)P.t.report_open=clock();
  P.rep={step:0,sel:null,form:{}};log('report_open','post',{n:P.counts.reportOpens});
}

/* ================= handlers ================= */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,k=t.dataset.k;
  if(t.tagName==='INPUT'&&(t.type==='radio'||t.type==='checkbox'))return;
  if(t.tagName==='TEXTAREA')return;
  if(a==='consent'){log('consent','given',{version:CONFIG.STUDY_VERSION});P.arm=await assignArm();P.consentAt=clock();log('assign',P.arm,{source:P.assignSource});
    P.subject=CONFIG.SUBJECT_MODE==='standin'?'standin':'';setScreen('setup');return}
  if(a==='cam-on'){try{STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});P.cam='live';P.camErr=false;log('photo','camera_on')}catch(err){P.camErr=true;log('photo','camera_unavailable')}render();return}
  if(a==='cam-off'){stopCam();P.cam='off';render();return}
  if(a==='cam-snap'){const v=$('#cam');if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=c.height=512;const s=Math.min(v.videoWidth,v.videoHeight);c.getContext('2d').drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,512,512);P.srcCanvas=c;stopCam();P.cam='ready';log('photo','captured');render();return}
  if(a==='cam-redo'){P.srcCanvas=null;P.cam='off';render();return}
  if(a==='setup-next'){
    if(P.subject==='self'){P.name=($('#nm')&&$('#nm').value.trim())||P.name;log('setup','self',{alter_consent:1,name_given:P.name?1:0})}
    else{P.srcCanvas=standinCanvas();log('setup','standin')}
    setScreen('brief');return}
  if(a==='brief-go'){
    P.targetUrl=composeTarget(P.srcCanvas);
    const rnd=mulberry32(hash(P.pid+P.session));
    const base=ARM_PATHS[P.arm].filter(x=>x!=='other'&&!(P.arm==='direct'&&CONFIG.DIRECT_FIRST&&x==='ai'));
    P.order=(P.arm==='direct'&&CONFIG.DIRECT_FIRST?['ai']:[]).concat(shuffle(base,rnd)).concat(['other']);
    P.t.task_start=clock();log('task_start','platform',{order:P.order});setScreen('platform');return}
  if(a==='nav-home'){P.view='home';log('nav','home');render();return}
  if(a==='nav-help'){P.view='help';log('nav','help');if(!P.pol)P.pol={at:clock(),from:'help'};P.polOpens++;log('policy_open','help');render();return}
  if(a==='notif'||a==='like'||a==='comment'||a==='share'){if(a==='like')P.counts.like++;if(a==='comment')P.counts.comment++;log('click',a);return}
  if(a==='menu'){P.menuFor=P.menuFor===k?null:k;P.counts.menu++;if(P.t.menu_open==null)P.t.menu_open=clock();log('menu_open',k);render();return}
  if(a==='m-save'||a==='m-copy'){P.counts[a==='m-save'?'save':'copy']++;log('menu_action',a,{post:k});P.menuFor=null;toast(a==='m-save'?'Saved':'Link copied');return}
  if(a==='m-hide'||a==='m-block'){const kind=a==='m-hide'?'hidden':'blocked';P.counts[kind==='hidden'?'hide':'block']++;P.gone[k]=kind;log('menu_action',a,{post:k});P.menuFor=null;render();return}
  if(a==='undo'){delete P.gone[k];log('undo',k);render();return}
  if(a==='report-from'){P.menuFor=null;if(k!=='TARGET'){P.counts.nontarget++;log('report_nontarget',k);toast('Imagine you are reporting the post you came across earlier.');return}openReport();render();return}
  if(a==='pol-open'){P.pol={at:clock(),from:'report'};P.polOpens++;log('policy_open','report');render();return}
  if(a==='pol-close'){endPolicy();render();return}
  if(a==='rep-cancel'){log('report_cancel','step'+P.rep.step);P.rep=null;render();return}
  if(a==='rep-giveup'){P.gaveUp=1;if(P.t.submit==null)P.t.submit=clock();log('report_giveup','step'+P.rep.step,{ms:dur('report_open','submit')});P.status='gave_up';P.rep=null;await finishTask();return}
  if(a==='rep-next'){if(P.t.next==null)P.t.next=clock();log('report_next',P.rep.sel);P.rep.step=1;render();return}
  if(a==='rep-back'){P.backs++;log('report_back',P.rep.sel);P.rep.step=0;render();return}
  if(a==='rep-submit'){P.t.submit=clock();P.finalPath=P.rep.sel;P.formJson=JSON.stringify(Object.assign({},P.rep.form,{desc:P.rep.form.desc?'[given]':''}));log('report_submit',P.rep.sel);P.rep.step=3;render();return}
  if(a==='rep-done'){P.rep=null;await finishTask();return}
  if(a==='after-go'){const s=P.survey;s.desc=$('#q_desc').value;s.prior=$('#q_prior').value;s.text=$('#q_text').value.trim();log('survey','submitted',{clarity:s.clarity,confidence:s.confidence,ailook:s.ailook,realism:s.realism});setScreen('debrief');return}
  if(a==='debrief-go'){clearImages();log('image','cleared');setScreen('protect');return}
  if(a==='finish'){P.status=P.gaveUp?'gave_up':'complete';P.completedAt=new Date().toISOString();log('study','finish');P.screen='done';render();await sendSummary();return}
  if(a==='exit'){P.exitOpen=true;render();return}
  if(a==='exit-no'){P.exitOpen=false;render();return}
  if(a==='exit-yes'){P.exitOpen=false;clearImages();P.status='withdrawn';P.completedAt=new Date().toISOString();log('study','withdraw');P.screen='exit';render();await sendSummary();return}
});
async function finishTask(){endPolicy();log('task_end','platform',{status:P.status});setScreen('after');}
document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;
  if(t.id==='c1'||t.id==='c2'||t.id==='c3'){$('#goc').disabled=!($('#c1').checked&&$('#c2').checked&&$('#c3').checked);return}
  if(t.id==='file'&&t.files&&t.files[0]){
    const f=t.files[0],url=URL.createObjectURL(f),img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const s=Math.min(img.width,img.height);c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,512,512);URL.revokeObjectURL(url);P.srcCanvas=c;P.cam='ready';log('photo','uploaded');render()};
    img.onerror=()=>{URL.revokeObjectURL(url)};img.src=url;return}
  if(t.id==='altc'){P.altConsent=t.checked;log('setup','alter_consent',{v:t.checked});P.name=($('#nm')&&$('#nm').value.trim())||P.name;render();return}
  if(t.id==='q_desc'||t.id==='q_prior'){checkAfter();return}
  if(a==='subj'){P.subject=t.dataset.k;log('setup','subject',{v:P.subject});render();return}
  if(a==='q-set'){P.survey[t.dataset.k]=t.value;checkAfter();return}
  if(a==='rep-sel'){const k=t.dataset.k;if(P.rep.sel==null){P.firstPath=k;P.t.first_select=clock();log('option_select',k,{first:1,pos:P.order.indexOf(k)})}else if(P.rep.sel!==k){P.pathChanges++;log('option_change',k,{from:P.rep.sel,pos:P.order.indexOf(k)})}P.rep.sel=k;P.rep.form={};render();return}
  if(a==='rep-f'){P.rep.form[t.dataset.n]=t.dataset.v;render();return}
  if(a==='rep-fc'){P.rep.form[t.dataset.n]=t.checked;render();return}
  if(a==='prot'){P.prot[t.dataset.k]=t.checked;log('protect',t.dataset.k,{on:t.checked});render();return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='rep-ft'){P.rep.form[t.dataset.n]=t.value;const m=document.querySelector('[data-act=rep-submit]');if(m){const f=FORMS[P.rep.sel];m.disabled=!(f.every(q=>!q.req||(q.t==='check'?P.rep.form[q.n]:(P.rep.form[q.n]||'').trim()))&&f.every(q=>q.t!=='radio'||P.rep.form[q.n]))}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='fwq'){P.counts.search++;log('search','query',{len:e.target.value.length});e.target.value=''}
  if(e.key==='Escape'){if(P.pol&&P.pol.from==='report'){endPolicy();render()}}
});
function checkAfter(){const s=P.survey;const ok=s.clarity&&s.confidence&&s.ailook&&s.realism&&$('#q_desc').value&&$('#q_prior').value;const b=$('#ago');if(b)b.disabled=!ok}
window.addEventListener('pagehide',()=>{flush()});
window.__FERNWOOD={P:P,summary:summary,CONFIG:CONFIG};
log('screen','consent');render();
})();
</script>
